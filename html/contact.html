<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Start Project — Contact</title>
  <meta name="description" content="Start Project form" />
  <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand brand-link" href="./index.html" aria-label="Torna alla pagina Project">
        <div class="brand-name">Emma Mackey</div>
        <div class="brand-role">Senior UI/UX Designer</div>
      </a>

      <div class="header-right">
        <div class="status-pill">
          <span class="dot" aria-hidden="true"></span>
          <span>Available for work</span>
        </div>
        <a class="btn btn-ghost" href="./index.html">Back</a>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <nav class="breadcrumb" aria-label="breadcrumb">
        <a href="./index.html">Project</a>
        <span aria-hidden="true">/</span>
        <span>Start Project</span>
      </nav>

      <h1 class="h1">Start Project</h1>
      <p class="muted">Compila il form e ti ricontatto il prima possibile.</p>

      <div class="form-wrap panel">
        <form id="projectForm" novalidate>
          <div class="form-grid">
            <label class="field">
              <span class="label">Nome *</span>
              <input class="input" name="name" type="text" autocomplete="name" required minlength="2" />
              <span class="error" data-error-for="name"></span>
            </label>

            <label class="field">
              <span class="label">Email *</span>
              <input class="input" name="email" type="email" autocomplete="email" required />
              <span class="error" data-error-for="email"></span>
            </label>

            <label class="field">
              <span class="label">Azienda</span>
              <input class="input" name="company" type="text" autocomplete="organization" />
            </label>

            <label class="field">
              <span class="label">Budget (indicativo)</span>
              <select class="input" name="budget">
                <option value="">Seleziona…</option>
                <option value="lt-1k">&lt; 1.000€</option>
                <option value="1k-3k">1.000€ – 3.000€</option>
                <option value="3k-8k">3.000€ – 8.000€</option>
                <option value="8k+">8.000€+</option>
              </select>
            </label>

            <label class="field field-full">
              <span class="label">Di cosa hai bisogno? *</span>
              <textarea class="input textarea" name="message" required minlength="10" rows="6"
                placeholder="Descrivi obiettivi, scadenze, link utili…"></textarea>
              <span class="error" data-error-for="message"></span>
            </label>
          </div>

          <div class="actions">
            <button class="btn btn-primary" type="submit">Send Request</button>
            <a class="btn btn-ghost" href="./index.html">Cancel</a>
          </div>

          <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
        </form>
      </div>

      <div class="section-tight">
        <div class="cta">
          <div>
            <h2 class="h2">Direct links</h2>
            <p class="muted">Se preferisci scrivermi direttamente.</p>
          </div>
          <div class="cta-actions">
            <a class="btn btn-ghost" href="https://www.instagram.com/" target="_blank" rel="noreferrer">Instagram</a>
            <a class="btn btn-ghost" href="mailto:hello@example.com">Gmail</a>
            <a class="btn btn-ghost" href="https://www.linkedin.com" target="_blank" rel="noreferrer">LinkedIn</a>
            <a class="btn btn-ghost" href="https://www.figma.com" target="_blank" rel="noreferrer">Figma</a>
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="muted">© 2025 — All rights reserved</div>
      <div class="muted">Made by Coco Design</div>
    </div>
  </footer>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
